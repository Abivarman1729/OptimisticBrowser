name: optimistic_browser
description: Optimistic Browser — modular private AI browser platform.
publish_to: "none"
version: 10.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.14.1
  http: ^1.5.0
  crypto: ^3.0.7
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/optimistic_browser_8k.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/optimistic_browser_8k.png
  adaptive_icon_background: "#07111F"
  adaptive_icon_foreground: assets/branding/optimistic_browser_8k.png
